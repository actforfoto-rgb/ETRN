name: NORM ARBITRAGE MOEX Crypto Probe

on:
  push:
    branches:
      - main
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/MOEX_CRYPTO_TRIGGER.txt'
      - '.github/workflows/norm-arb-moex-crypto.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norm-arb-moex-crypto
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ARB branch
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Probe crypto perpetuals
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_crypto_perp_probe.py

      - name: Probe crypto IndexDiv pages
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_crypto_indexdiv_probe.py

      - name: Research crypto perpetual-fixed curves
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_crypto_curve_research.py
      - name: Save results
        shell: bash
        run: |
          git config user.name "NORM LAB MOEX Crypto"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/results/moex_crypto_perp_probe.json NORM_LAB/ARBITRAGE_RADAR/results/moex_crypto_indexdiv_page_probe.json NORM_LAB/ARBITRAGE_RADAR/results/moex_crypto_curve_*
          git commit -m "MOEX crypto perpetual probe [skip ci]" || true
          git fetch origin norm-arb-r01
          git rebase origin/norm-arb-r01
          git push origin HEAD:norm-arb-r01

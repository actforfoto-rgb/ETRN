name: NORM 03B - fully paired arb forward (read only)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/norm-03b-paired-forward.yml'
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norm03b-paired-forward-shadow
  cancel-in-progress: false

jobs:
  paired-public-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: NORM_LAB/ECONOMIC_LAB_03B
    steps:
      - name: Check out isolated research branch (no personal tokens)
        uses: actions/checkout@v4
        with:
          ref: norm-03b-hedged-shadow-20261022
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test paired mechanism and no-orders gates
        run: python -m unittest discover -s tests -p 'test_arb_forward.py' -v
      - name: Test M2 spot-perpetual funding gates
        run: python -m unittest discover -s tests -p 'test_funding_gate.py' -v
      - name: Test M1 native-vs-synthetic MOEX calendar spreads
        run: python -m unittest discover -s tests -p 'test_moex_native_spread_gate.py' -v
      - name: Test M8 MOEX RUB stock-spot and future cash carry
        run: python -m unittest discover -s tests -p 'test_moex_rub_cash_carry.py' -v
      - name: Test M7 three-leg triangular arbitrage
        run: python -m unittest discover -s tests -p 'test_cex_triangle_gate.py' -v
      - name: Test M9 inverse-vs-linear delta-neutral funding basis
        run: python -m unittest discover -s tests -p 'test_inverse_linear_funding_gate.py' -v
      - name: Observe independent exchange events for 90 seconds
        env:
          REPORT_03B: ${{ runner.temp }}/norm03b_m4_forward_aggregate.json
        run: |
          set -eu
          python arb_forward.py --seconds 90 --interval 8 --out "$REPORT_03B"
          python - <<'PY'
          import json, os
          d = json.load(open(os.environ["REPORT_03B"],encoding="utf-8"))
          valid = sum(int(s["valid_books"]) for s in d["quotes"])
          print(json.dumps({
              "market_book_observations": valid,
              "windows": len(d["quotes"]),
              "universe_size": d.get("universe_size"),
              "selected_assets": d.get("selected_assets"),
              "positive_initial_quotes": d["positive_first_quote_unique"],
              "positive_newer_quote_witnesses": len(d["episodes_with_positive_next_quote"]),
              "closed_cycles": d["full_closed_arbitrage_cycles"],
              "real_orders": d["real_orders"],
              "rub_balance_unchanged": d["virtual_rub_balance_unmodified"]
          }))
          if valid == 0:
              raise SystemExit("No usable live public data; no claims of working collector")
          PY
      - name: Evaluate public same-venue funding and historical settlements (no orders)
        env:
          REPORT_M2: ${{ runner.temp }}/norm03b_m2_funding_aggregate.json
        run: |
          set -u
          python funding_gate.py --out "$REPORT_M2" || echo '{"status":"DATA_BLOCKED","schema":"NORM03B_M2_GATE_FUNDING_FORWARD_READONLY_V1","real_orders":0,"paper_fills":0}' > "$REPORT_M2"
          python - <<'PY'
          import os,json
          r=json.load(open(os.environ["REPORT_M2"],encoding="utf-8"))
          print(json.dumps({k:r.get(k) for k in ["status","all_perpetuals","all_spots","screened_positive_rate_and_matching_pair","forward_watches","positive_projected_one_payment_after_all_exit_costs","positive_historic_11_refund_of_current_liquidation","paper_fills","real_orders"]},sort_keys=True))
          if r.get("real_orders",0)!=0 or r.get("paper_fills",0)!=0:
              raise SystemExit("NO_ORDERS_INVARIANT_BROKEN")
          PY
      - name: Evaluate MOEX native vs synthetic spread (indicative only)
        env:
          REPORT_M1: ${{ runner.temp }}/norm03b_m1_moex_spread_aggregate.json
        run: |
          set -u
          python moex_native_spread_gate.py --out "$REPORT_M1" || echo '{"schema":"NORM03B_M1_MOEX_NATIVE_VS_SYNTHETIC_READONLY_V1","status":"DATA_BLOCKED","paper_fills":0,"real_orders":0,"virtual_rub_equity":"50000"}' > "$REPORT_M1"
          python - <<'PY'
          import os,json
          r=json.load(open(os.environ["REPORT_M1"],encoding="utf-8"))
          names=["status","number_of_futures","number_of_native_spread_html_quotes",
                 "matched_native_vs_synthetic_comparisons","gross_apparent_crosses",
                 "exchange_fee_only_positive_indications",
                 "native_iss_active_after_fee_only_indications",
                 "native_iss_reported_inactive_fee_only_indications",
                 "paper_fills","real_orders"]
          print(json.dumps({k:r.get(k) for k in names},sort_keys=True))
          if r.get("real_orders",0)!=0 or r.get("paper_fills",0)!=0:
              raise SystemExit("M1_NO_ORDERS_INVARIANT_BROKEN")
          PY
      - name: Observe M7 same-exchange triangular arbitrage (45 seconds)
        env:
          REPORT_M7: ${{ runner.temp }}/norm03b_m7_cex_triangle_aggregate.json
        run: |
          set -u
          python cex_triangle_gate.py --seconds 44 --interval 8 --out "$REPORT_M7" || echo '{"schema":"NORM03B_OKX_M7_SAME_VENUE_TRIANGLE_READONLY_V1","mode":"DATA_BLOCKED","paper_fills":0,"real_orders":0,"snapshots":[]}' > "$REPORT_M7"
          python - <<'PY'
          import os,json
          r=json.load(open(os.environ["REPORT_M7"],encoding="utf-8"))
          snapshots=r.get("snapshots",[])
          print(json.dumps({
              "mode":r.get("mode"),"snapshots":len(snapshots),
              "triangle_paths_max":max((x.get("possible_triangle_paths",0) for x in snapshots),default=0),
              "full_quote_cycles_sum":sum(x.get("fully_priced_roundtrips",0) for x in snapshots),
              "positive_post_fees_sum":sum(x.get("positive_after_3_taker_fees_and_lot_rounding",0) for x in snapshots),
              "later_quote_positive":len(r.get("later_independent_positive_quote_witnesses",[])),
              "conditional_regional_fee_positive":sum(x.get("regional_promo_positive_quote_screens",0) for x in snapshots),
              "positive_zero_fee_gross":sum(x.get("positive_without_taker_fees_after_bid_ask_and_lots",0) for x in snapshots),
              "best_uniform_fee_bp_per_leg":max((float(x["best_uniform_fee_frontier"][0]["uniform_fee_break_even_bp_per_leg"]) for x in snapshots if x.get("best_uniform_fee_frontier")),default=None),
              "conditional_promo_owner_verified":r.get("regional_fee_owner_eligibility_verified"),
              "real_orders":r.get("real_orders",0),"paper_fills":r.get("paper_fills",0)
          },sort_keys=True))
          if r.get("real_orders",0)!=0 or r.get("paper_fills",0)!=0:
              raise SystemExit("M7_NO_ORDERS_INVARIANT_BROKEN")
          PY
      - name: Evaluate M8 MOEX ruble cash-and-carry (no orders)
        env:
          REPORT_M8: ${{ runner.temp }}/norm03b_m8_rub_carry_aggregate.json
        run: |
          set -u
          python moex_rub_cash_carry.py --out "$REPORT_M8" || echo '{"schema":"NORM03B_M8_MOEX_RUB_SPOT_FUTURES_CASH_CARRY_READONLY_V1","status":"DATA_BLOCKED","paper_fills":0,"real_orders":0}' > "$REPORT_M8"
          python - <<'PY'
          import os,json
          r=json.load(open(os.environ["REPORT_M8"],encoding="utf-8"))
          names=["total_futures","total_tqbr_shares","valid_rub_financeable_constructions",
                 "false_underlying_collisions","positive_14pct_capital_cost",
                 "positive_18pct_capital_cost","paper_fills","real_orders","status"]
          print(json.dumps({x:r.get(x) for x in names},sort_keys=True))
          if r.get("real_orders",0)!=0 or r.get("paper_fills",0)!=0:
              raise SystemExit("M8_NO_ORDERS_INVARIANT_BROKEN")
          PY
      - name: Evaluate M9 inverse USD versus linear USDT funding basis (no orders)
        env:
          REPORT_M9: ${{ runner.temp }}/norm03b_m9_inverse_linear_funding_aggregate.json
        run: |
          set -u
          python inverse_linear_funding_gate.py --out "$REPORT_M9" || echo '{"schema":"NORM03B_M9_OKX_INVERSE_LINEAR_HEDGED_FUNDING_V1","mode":"DATA_BLOCKED","paper_fills":0,"real_orders":0}' > "$REPORT_M9"
          python - <<'PY'
          import os,json
          r=json.load(open(os.environ["REPORT_M9"],encoding="utf-8"))
          keys=["mode","funding_pair_count","selected_assets","screened_complete_hedges",
                "historic_30_repeat_scenario_positive",
                "confirmed_future_realized_pnl_cycles","paper_fills","real_orders"]
          print(json.dumps({k:r.get(k) for k in keys},sort_keys=True))
          if r.get("real_orders",0)!=0 or r.get("paper_fills",0)!=0:
              raise SystemExit("M9_NO_ORDERS_INVARIANT_BROKEN")
          PY
      - name: Upload sanitized aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORM03B_PAIR_FORWARD_PUBLIC_SUMMARY
          path: |
            ${{ runner.temp }}/norm03b_m4_forward_aggregate.json
            ${{ runner.temp }}/norm03b_m2_funding_aggregate.json
            ${{ runner.temp }}/norm03b_m1_moex_spread_aggregate.json
            ${{ runner.temp }}/norm03b_m7_cex_triangle_aggregate.json
            ${{ runner.temp }}/norm03b_m8_rub_carry_aggregate.json
            ${{ runner.temp }}/norm03b_m9_inverse_linear_funding_aggregate.json
          retention-days: 7
          if-no-files-found: warn

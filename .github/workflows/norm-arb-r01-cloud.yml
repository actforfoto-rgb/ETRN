name: NORM ARBITRAGE RADAR Extended Runner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ARB branch
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0

      - name: Detect flags
        id: flags
        shell: bash
        run: |
          C02="no"; M01="no"
          [ -f NORM_LAB/ARBITRAGE_RADAR/RUN_C02.flag ] && grep -q '^RUN$' NORM_LAB/ARBITRAGE_RADAR/RUN_C02.flag && C02="yes"
          [ -f NORM_LAB/ARBITRAGE_RADAR/RUN_M01.flag ] && grep -q '^RUN$' NORM_LAB/ARBITRAGE_RADAR/RUN_M01.flag && M01="yes"
          echo "c02=$C02" >> "$GITHUB_OUTPUT"
          echo "m01=$M01" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.flags.outputs.c02 == 'yes' || steps.flags.outputs.m01 == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.flags.outputs.c02 == 'yes' || steps.flags.outputs.m01 == 'yes'
        run: python -m pip install --disable-pip-version-check --quiet ccxt requests

      - name: Run ARB-C02
        if: steps.flags.outputs.c02 == 'yes'
        run: python NORM_LAB/ARBITRAGE_RADAR/crypto_c02.py --minutes 1

      - name: Run MOEX-M01 probe
        if: steps.flags.outputs.m01 == 'yes'
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_m01_probe.py

      - name: Save outputs and close flags
        if: always() && (steps.flags.outputs.c02 == 'yes' || steps.flags.outputs.m01 == 'yes')
        shell: bash
        run: |
          if [ "${{ steps.flags.outputs.c02 }}" = "yes" ]; then printf "DONE\n" > NORM_LAB/ARBITRAGE_RADAR/RUN_C02.flag; fi
          if [ "${{ steps.flags.outputs.m01 }}" = "yes" ]; then printf "DONE\n" > NORM_LAB/ARBITRAGE_RADAR/RUN_M01.flag; fi
          git config user.name "NORM LAB Bot"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/results NORM_LAB/ARBITRAGE_RADAR/RUN_C02.flag NORM_LAB/ARBITRAGE_RADAR/RUN_M01.flag || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "ARB extended run results [skip ci]"
            git push origin HEAD:norm-arb-r01
          fi

      - name: Upload artifact
        if: always() && (steps.flags.outputs.c02 == 'yes' || steps.flags.outputs.m01 == 'yes')
        uses: actions/upload-artifact@v4
        with:
          name: NORM_ARBITRAGE_EXTENDED_RESULTS
          path: NORM_LAB/ARBITRAGE_RADAR/results
          if-no-files-found: warn

name: NORM ARBITRAGE RADAR Branch Runner

on:
  push:
    branches:
      - norm-arb-r01
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/TRIGGER_EXTENDED.txt'
      - '.github/workflows/norm-arb-r01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet ccxt requests beautifulsoup4

      - name: Run ARB-C02
        run: python NORM_LAB/ARBITRAGE_RADAR/crypto_c02.py --minutes 1

      - name: Run MOEX-M01 probe
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_m01_probe.py

      - name: Run SBER-SBERF funding study
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_sberf_funding.py

      - name: Save outputs
        if: always()
        shell: bash
        run: |
          git config user.name "NORM LAB Bot"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/results || true
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "ARB C02 + MOEX M01 results [skip ci]"
            git push origin HEAD:norm-arb-r01
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORM_ARBITRAGE_RESULTS
          path: NORM_LAB/ARBITRAGE_RADAR/results
          if-no-files-found: warn

name: Extract Saby CryptoPro Rutoken structure

on:
  push:
    branches: [dev/saby-rutoken-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact Saby TMS 26.3246.5 from RuStore
        run: |
          rm -rf audit/saby_rutoken /tmp/saby_rutoken_audit /tmp/saby_jadx
          python3 tools/audit_saby_rutoken.py
      - name: Install verified JADX
        run: |
          curl --fail --location --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx.zip' | sha256sum -c -
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile and extract only structural evidence
        run: |
          timeout 720 /tmp/jadx/bin/jadx --no-res --deobf --threads-count 2 -d /tmp/saby_jadx /tmp/saby_rutoken_audit/saby.apk >/tmp/jadx-run.log 2>&1 || true
          python3 tools/extract_cryptopro_rutoken_structure.py /tmp/saby_jadx audit/saby_rutoken
      - name: Remove proprietary application bytes
        if: always()
        run: |
          rm -rf /tmp/saby_rutoken_audit /tmp/saby_jadx /tmp/jadx /tmp/jadx.zip
          if find audit -type f | grep -E '\.(apk|dex|so|java|kt)$'; then exit 1; fi
      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SABY_2632465_CRYPTOPRO_RUTOKEN_STRUCTURE
          path: |
            audit/saby_rutoken/CRYPTOPRO_RUTOKEN_STRUCTURE.*
            audit/saby_rutoken/RUSTORE_METADATA.json
            audit/saby_rutoken/APK_IDENTITY.txt
          if-no-files-found: error
          retention-days: 14

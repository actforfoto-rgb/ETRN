name: NORM ARBITRAGE Event Fast

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/FAST_TRIGGER.txt'
      - '.github/workflows/norm-arb-event-fast.yml'

permissions:
  contents: write

concurrency:
  group: norm-arb-event-fast
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ARB branch
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet ccxt requests beautifulsoup4

      - name: Compile fast hunters
        run: |
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/op_gate_okx_fast_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/crypto_validated_fast_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/crypto_live_execution_gate.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/si_calendar_fast_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/si_calendar_page_shadow.py

      - name: Run dedicated OP Gate-OKX fast shadow
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/op_gate_okx_fast_shadow.py

      - name: Run validated crypto fast shadow
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/crypto_validated_fast_shadow.py

      - name: Run crypto live execution gate
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/crypto_live_execution_gate.py

      - name: Run Si synthetic fast shadow
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/si_calendar_fast_shadow.py

      - name: Run official Si calendar page shadow
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/si_calendar_page_shadow.py

      - name: Run promotion gatekeeper
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/gatekeeper.py

      - name: Persist fast state
        if: always()
        shell: bash
        run: |
          git config user.name "NORM LAB Fast Hunter"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/production/event_state NORM_LAB/ARBITRAGE_RADAR/production/promotion_status.json || true
          if git diff --cached --quiet; then
            echo "No fast-state changes"
          else
            git commit -m "ARB fast event state [skip ci]"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin norm-arb-r01
              git -c rebase.autoStash=true rebase origin/norm-arb-r01 || { git rebase --abort || true; sleep 2; continue; }
              if git push origin HEAD:norm-arb-r01; then
                pushed=1
                break
              fi
              sleep 2
            done
            test "$pushed" -eq 1
          fi

      - name: Upload fast state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORM_ARB_EVENT_FAST
          path: NORM_LAB/ARBITRAGE_RADAR/production/event_state
          if-no-files-found: warn

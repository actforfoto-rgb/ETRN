name: NORM ARBITRAGE Validated Fast Shadow

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/FAST_TRIGGER.txt'
      - '.github/workflows/norm-arb-fast-shadow.yml'

permissions:
  contents: write

concurrency:
  group: norm-arb-fast-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ARB branch
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet ccxt requests
      - name: Compile
        run: |
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/crypto_validated_fast_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/si_calendar_fast_shadow.py
      - name: Crypto validated fast shadow
        run: python NORM_LAB/ARBITRAGE_RADAR/production/crypto_validated_fast_shadow.py
      - name: Si calendar fast shadow
        run: python NORM_LAB/ARBITRAGE_RADAR/production/si_calendar_fast_shadow.py
      - name: Event promotion gate
        run: python NORM_LAB/ARBITRAGE_RADAR/production/gatekeeper.py
      - name: Persist
        if: always()
        shell: bash
        run: |
          git config user.name "NORM LAB Fast Shadow"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/production/event_state NORM_LAB/ARBITRAGE_RADAR/production/promotion_status.json || true
          if git diff --cached --quiet; then
            echo "No fast-shadow state changes"
          else
            git commit -m "ARB validated fast shadow state [skip ci]"
            git fetch origin norm-arb-r01
            git -c rebase.autoStash=true rebase origin/norm-arb-r01
            git push origin HEAD:norm-arb-r01
          fi

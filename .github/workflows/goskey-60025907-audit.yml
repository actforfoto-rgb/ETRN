name: Audit Goskey 60025907 primary contract

on:
  push:
    branches: [dev/goskey-60025907-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify primary Goskey specification
        run: python3 tools/audit_goskey_60025907.py

      - name: Download and verify primary API EPGU v1.14 specification
        run: python3 tools/audit_epgu_core_v1_14.py

      - name: Remove source DOCX files
        if: always()
        run: rm -f /tmp/goskey_60025907.docx /tmp/epgu_core_v1_14.docx

      - name: Upload narrow text-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOSKEY_60025907_AND_EPGU_CORE_PRIMARY_AUDIT
          path: audit/
          if-no-files-found: error
          retention-days: 14

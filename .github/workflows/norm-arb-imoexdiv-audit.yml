name: NORM ARBITRAGE IMOEXDIV Audit

on:
  push:
    branches:
      - main
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/DIVIDEND_TRIGGER.txt'
      - '.github/workflows/norm-arb-imoexdiv-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norm-arb-imoexdiv
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ARB branch
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Probe IMOEXDIV
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_dividend_probe.py

      - name: Probe perpetual metadata
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_perpetual_metadata_probe.py

      - name: Save probe
        shell: bash
        run: |
          git config user.name "NORM LAB IMOEXDIV Audit"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/results/imoexdiv_history_probe.* NORM_LAB/ARBITRAGE_RADAR/results/moex_perpetual_metadata_probe.json
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "IMOEXDIV audit results [skip ci]"
            git fetch origin norm-arb-r01
            git rebase origin/norm-arb-r01
            git push origin HEAD:norm-arb-r01
          fi

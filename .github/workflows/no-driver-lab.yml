name: ETRN no-driver laboratory
on:
  push:
    branches: [dev/no-driver-lab-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply guarded laboratory source change
        run: |
          python3 tools/apply_lab_r1.py
          mkdir -p evidence
      - name: Compile and run domain and protocol tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Confirm application has no Internet permission
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > evidence/permissions.txt
          if grep -q android.permission.INTERNET evidence/permissions.txt; then exit 1; fi
      - name: Provision Android emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/etrn-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/etrn-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-30;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n etrn_lab -k "system-images;android-30;google_apis;x86_64" -p "$ANDROID_AVD_HOME/etrn_lab.avd" --force
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd > evidence/avd-manager.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds > evidence/avd-emulator.txt
          test -f "$ANDROID_AVD_HOME/etrn_lab.ini"
          grep -qx etrn_lab evidence/avd-emulator.txt
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd etrn_lab -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 > evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          BOOTED=no
          for attempt in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat evidence/emulator.log; exit 1; fi
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then BOOTED=yes; break; fi
            sleep 2
          done
          test "$BOOTED" = yes || { cat evidence/emulator.log; exit 1; }
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Execute Android UI tests with synthetic transport
        run: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Save tested readable source to development branch only
        run: |
          if ! git diff --quiet -- app/src/main/java/ru/komus/etrnprobe/MainActivity.java; then
            REMOTE_SHA=$(git ls-remote origin refs/heads/dev/no-driver-lab-r1 | cut -f1)
            test "$REMOTE_SHA" = "$GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/ru/komus/etrnprobe/MainActivity.java
            git commit -m "Persist tested no-driver lab source [skip ci]"
            git push origin HEAD:dev/no-driver-lab-r1
          fi
      - name: Record evidence
        if: always()
        run: |
          mkdir -p evidence
          adb logcat -d > evidence/android-logcat.txt 2>/dev/null || true
          adb shell am start -n ru.komus.etrnprobe.lab/ru.komus.etrnprobe.MainActivity >/dev/null 2>&1 || true
          sleep 1
          adb exec-out screencap -p > evidence/emulator-screen.png 2>/dev/null || true
          python3 tools/lab_proof.py
          git diff -- app/src/main/java/ru/komus/etrnprobe/MainActivity.java > evidence/uncommitted-built-source.patch
          sha256sum app/src/main/java/ru/komus/etrnprobe/*.java > evidence/built-source-sha256.txt
          git archive --format=zip -o evidence/ETRN_LAB_SOURCE.zip HEAD
      - name: Upload reports, not a driver APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETRN_NO_DRIVER_LAB_EVIDENCE
          path: |
            evidence/*
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 14

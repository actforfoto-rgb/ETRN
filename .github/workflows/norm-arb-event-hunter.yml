name: NORM ARBITRAGE Event Hunter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/EVENT_TRIGGER.txt'
      - '.github/workflows/norm-arb-event-hunter.yml'

permissions:
  contents: write

concurrency:
  group: norm-arb-event-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ARB branch
        uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet ccxt requests beautifulsoup4

      - name: Compile event hunters
        run: |
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/crypto_event_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/crypto_spot_event_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/moex_event_shadow.py
          python -m py_compile NORM_LAB/ARBITRAGE_RADAR/production/moex_calendar_universe_shadow.py

      - name: Run whole MOEX calendar universe
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/production/moex_calendar_universe_shadow.py

      - name: Run crypto event universe
        run: python NORM_LAB/ARBITRAGE_RADAR/production/crypto_event_shadow.py

      - name: Run crypto spot event universe
        run: python NORM_LAB/ARBITRAGE_RADAR/production/crypto_spot_event_shadow.py

      - name: Run MOEX event universe
        run: python NORM_LAB/ARBITRAGE_RADAR/production/moex_event_shadow.py

      - name: Run MOEX option parity event scan
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/moex_option_parity_scan.py

      - name: Persist event state
        if: always()
        shell: bash
        run: |
          git config user.name "NORM LAB Event Hunter"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/production/event_state NORM_LAB/ARBITRAGE_RADAR/results/moex_option_parity_scan.json || true
          if git diff --cached --quiet; then
            echo "No event-state changes"
          else
            git commit -m "ARB event hunter state [skip ci]"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin norm-arb-r01
              git -c rebase.autoStash=true rebase origin/norm-arb-r01 || { git rebase --abort || true; sleep 2; continue; }
              if git push origin HEAD:norm-arb-r01; then
                pushed=1
                break
              fi
              sleep 2
            done
            test "$pushed" -eq 1
          fi

      - name: Upload event hunter state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORM_ARB_EVENT_HUNTER
          path: NORM_LAB/ARBITRAGE_RADAR/production/event_state
          if-no-files-found: warn

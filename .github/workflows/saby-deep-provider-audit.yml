name: Deep Saby CryptoPro provider audit

on:
  push:
    branches: [dev/saby-rutoken-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact Saby 26.3246.5
        run: |
          rm -rf audit/saby_rutoken audit/saby_deep /tmp/saby_rutoken_audit /tmp/saby_jadx
          python3 tools/audit_saby_rutoken.py
      - name: Native provider and container audit
        run: python3 tools/deep_saby_provider_audit.py
      - name: Targeted Java audit
        run: |
          curl --fail --location --retry 3             https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx.zip' | sha256sum -c -
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          timeout 720 /tmp/jadx/bin/jadx --no-res --deobf --threads-count 2             -d /tmp/saby_jadx /tmp/saby_rutoken_audit/saby.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/extract_targeted_saby_java.py /tmp/saby_jadx
          tail -200 /tmp/jadx.log > audit/saby_deep/JADX_TAIL.log || true
      - name: Remove proprietary binaries and source
        if: always()
        run: |
          rm -f /tmp/saby_rutoken_audit/saby.apk /tmp/jadx.zip
          rm -rf /tmp/saby_jadx /tmp/jadx
          if find audit -type f | grep -E '\.(apk|dex|so)$'; then
            echo "Unexpected proprietary binary in audit"; exit 1
          fi
      - name: Upload text-only deep audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SABY_2632465_DEEP_PROVIDER_AUDIT
          path: audit/saby_deep/
          if-no-files-found: error
          retention-days: 14

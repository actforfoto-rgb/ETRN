name: NORM ARBITRAGE Crypto Maker Research

on:
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NORM_LAB/ARBITRAGE_RADAR/CRYPTO_MAKER_TRIGGER.txt'
      - '.github/workflows/norm-arb-crypto-maker-research.yml'

permissions:
  contents: write

concurrency:
  group: norm-arb-crypto-maker-research
  cancel-in-progress: false

jobs:
  maker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: norm-arb-r01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check --quiet ccxt

      - name: Conservative OP maker fill validation
        run: python NORM_LAB/ARBITRAGE_RADAR/crypto_op_gate_okx_maker_fill_180d.py

      - name: Run 1-minute maker execution validation
        continue-on-error: true
        run: python NORM_LAB/ARBITRAGE_RADAR/crypto_op_gate_okx_maker_1m_30d.py

      - name: Save maker research
        if: always()
        shell: bash
        run: |
          git config user.name "NORM LAB Crypto Maker"
          git config user.email "actions@users.noreply.github.com"
          git add NORM_LAB/ARBITRAGE_RADAR/results || true
          if git diff --cached --quiet; then
            echo "No maker research changes"
          else
            git commit -m "ARB crypto maker research [skip ci]"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin norm-arb-r01
              if ! git merge --no-edit -X ours origin/norm-arb-r01; then
                git merge --abort || true
                sleep 2
                continue
              fi
              if git push origin HEAD:norm-arb-r01; then
                pushed=1
                break
              fi
              sleep 2
            done
            test "$pushed" -eq 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NORM_ARB_CRYPTO_MAKER_RESEARCH
          path: NORM_LAB/ARBITRAGE_RADAR/results
          if-no-files-found: warn

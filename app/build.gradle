plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.komus.etrnprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.komus.etrnprobe'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-r2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
